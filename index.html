<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>غير جوك TV — البث المباشر</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght=500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08080d; --panel: #0f0f18; --accent: #ff4757; --border: rgba(255, 255, 255, 0.06); --text: #f5f6fa;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text);
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}
.header {
  background: var(--panel); border-bottom: 1px solid var(--border);
  padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; height: 56px;
}
.logo { font-size: 1.3rem; font-weight: 900; color: #fff; }
.logo span { color: var(--accent); }
.live-badge {
  background: rgba(255, 71, 87, 0.15); border: 1px solid var(--accent); color: var(--accent);
  padding: 3px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; gap: 6px;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.main-layout { flex: 1; display: flex; overflow: hidden; background: #000; }
.player-container { flex: 3; display: flex; align-items: center; justify-content: center; background: #000; position: relative; }
.screen-wrapper { width: 100%; aspect-ratio: 16/9; max-height: 100%; background: #000; position: relative; overflow: hidden; }
#ytPlayer { width: 100%; height: 100%; border: none; transform: scale(1.01); }
.click-blocker { position: absolute; inset: 0; z-index: 5; background: transparent; }

.unmute-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 15;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; cursor: pointer;
}
.unmute-btn {
  background: var(--accent); color: #fff; border: none; width: 70px; height: 70px;
  border-radius: 50%; font-size: 1.6rem; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 30px var(--accent); animation: pulse 1.5s infinite;
}
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

.embedded-ticker { position: absolute; bottom: 0; left: 0; right: 0; height: 45px; background: rgba(255, 71, 87, 0.9); backdrop-filter: blur(5px); color: #fff; display: flex; align-items: center; z-index: 10; overflow: hidden; }
.ticker-tag { background: #b31020; height: 100%; padding: 0 16px; display: flex; align-items: center; font-weight: 900; font-size: 0.85rem; z-index: 12; white-space: nowrap; }
.ticker-space { flex: 1; overflow: hidden; display: flex; align-items: center; }
.ticker-move { display: inline-block; white-space: nowrap; padding-right: 100%; font-weight: 700; font-size: 1.05rem; animation: textRun 25s linear infinite; }
@keyframes textRun { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(100%, 0, 0); } }

.youtube-chat-panel { flex: 1; min-width: 340px; max-width: 420px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.chat-title { padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 0.9rem; }
.chat-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #0c0c14; }
.yt-message { font-size: 0.88rem; display: flex; gap: 8px; margin-bottom: 4px; }
.yt-author { font-weight: 700; color: #ffbc4b; }
.yt-text { color: #e4e7eb; }
.chat-inputs { padding: 14px; border-top: 1px solid var(--border); background: var(--panel); }
.input-style { width: 100%; padding: 10px 12px; background: #161622; border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 0.88rem; margin-bottom: 8px; }
.send-row { display: flex; justify-content: space-between; align-items: center; }
.send-btn { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; }

@media(max-width: 900px) { body { height: auto; overflow: auto; } .main-layout { flex-direction: column; } .youtube-chat-panel { max-width: 100%; min-width: 100%; height: 400px; } }
</style>
</head>
<body>

<header class="header">
  <div class="logo">غير جوك <span>TV</span></div>
  <div>
    <div class="live-badge"><i class="fa-solid fa-circle" style="font-size:7px; animation: blink 1.2s infinite; color:#fff;"></i> مباشر</div>
  </div>
</header>

<div class="main-layout">
  <div class="player-container">
    <div class="screen-wrapper">
      
      <div class="unmute-overlay" id="unmuteOverlay" onclick="enableSound()">
        <button class="unmute-btn"><i class="fa-solid fa-volume-high"></i></button>
        <span style="font-weight:700; font-size:0.95rem;">اضغط لتشغيل الصوت والمزامنة 🔊</span>
      </div>

      <div class="click-blocker"></div>
      <div id="ytPlayer"></div>

      <div class="embedded-ticker">
        <div class="ticker-tag"><i class="fa-solid fa-bullhorn"></i> شريط القناة</div>
        <div class="ticker-space">
          <div class="ticker-move" id="tickerText">أهلاً بكم في بث غيّر جوك TV المباشر...</div>
        </div>
      </div>

    </div>
  </div>

  <div class="youtube-chat-panel">
    <div class="chat-title"><span><i class="fa-regular fa-comments" style="color:var(--accent)"></i> المحادثة المباشرة</span></div>
    <div class="chat-body" id="chatBox"></div>
    <div class="chat-inputs">
      <input type="text" id="chatUser" class="input-style" placeholder="اسمك المستعار...">
      <div class="send-row">
        <input type="text" id="chatMsg" class="input-style" style="margin-bottom:0; width:75%;" placeholder="اكتب رسالة...">
        <button class="send-btn" onclick="sendChat()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const SB_URL = 'https://hvgtysuwzdtsgqjgsuhi.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2Z3R5c3V3emR0c2dxamdzdWhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjgyNDIsImV4cCI6MjA5NjE0NDI0Mn0.YjlcTIO_uycIolB3N2dkw0U76iJ76G57uhwpuTavrSM';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

let player, currentVideoId = '', isUnmuted = false, currentVolume = 100;
let localIndexOffset = 0; 
let lastSlot = -1;
let watchdogTimer = null;
const SONG_DURATION_MS = 4 * 60 * 1000;

function onYouTubeIframeAPIReady() {
  player = new YT.Player('ytPlayer', {
    playerVars: { 
      'autoplay': 1, 'controls': 0, 'rel': 0, 'loop': 1, 
      'modestbranding': 1, 'disablekb': 1, 'enablejsapi': 1,
      'origin': window.location.origin 
    },
    events: { 
      'onReady': () => { player.mute(); player.playVideo(); controlCenterLoop(); },
      'onStateChange': onPlayerStateChange,
      'onError': onPlayerError
    }
  });
}

function onPlayerStateChange(event) {
  // إذا بدأ الفيديو بالعمل بنجاح، نلغي مؤقت الرقابة فوراً
  if (event.data === YT.PlayerState.PLAYING) {
    clearTimeout(watchdogTimer);
  }
}

function startWatchdog() {
  clearTimeout(watchdogTimer);
  // إذا مرت 4 ثوانٍ والفيديو لم يشتغل (بقي معلقاً أو أسود)، نتخطاه فوراً
  watchdogTimer = setTimeout(() => {
    if (player && player.getPlayerState) {
      const state = player.getPlayerState();
      if (state === -1 || state === 3 || state === 5) {
        console.warn("نظام الرقابة رصد فيديو معلق! جاري التخطّي التلقائي الحتمي...");
        handleVideoFailure();
      }
    }
  }, 4000);
}

function onPlayerError(event) {
  console.warn("تم رصد خطأ في مشغل يوتيوب، الرمز:", event.data);
  handleVideoFailure();
}

function handleVideoFailure() {
  localIndexOffset++;
  controlCenterLoop();
}

function enableSound() {
  if(player && player.unMute) {
    player.unMute(); isUnmuted = true;
    player.setVolume(currentVolume);
    document.getElementById('unmuteOverlay').style.opacity = '0';
    setTimeout(()=> document.getElementById('unmuteOverlay').style.display = 'none', 300);
  }
}

function extractYoutubeId(url) {
  if (!url) return '';
  url = url.trim();
  if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
  if(url.includes('/shorts/')) return url.split('/shorts/')[1].split(/[?#&]/)[0];
  const regExp = /^.*(?:(?:youtu\.be\/|v\/|vi\/|u\/\w\/|embed\/|shorts\/)|(?:(?:watch|\?vvi?=|\&vvi?=)(?:\?v=)?))([^#\&\?]*).*/;
  const match = url.match(regExp);
  return (match && match[1] && match[1].trim().length === 11) ? match[1].trim() : '';
}

async function controlCenterLoop() {
  const { data: config } = await sb.from('channel_settings').select('*').eq('id', 'live_stream').single();
  if(!config) return;

  const t = document.getElementById('tickerText');
  t.textContent = (config.ticker_text && config.ticker_text.trim() !== '') ? config.ticker_text : "أهلاً بكم في إذاعة غيّر جوك TV البث المباشر المستمر";

  currentVolume = config.volume !== undefined ? config.volume : 100;
  if(player && player.setVolume && isUnmuted) player.setVolume(currentVolume);

  let targetUrl = '';
  let startSeconds = 0;
  const now = Date.now();

  if (config.override_url && config.override_start && (now - config.override_start < SONG_DURATION_MS)) {
    targetUrl = config.override_url;
    startSeconds = Math.floor((now - config.override_start) / 1000);
  } else {
    const { data: songs } = await sb.from('playlist').select('*').order('id', { ascending: true });
    if(songs && songs.length > 0) {
      const currentSlot = Math.floor(now / SONG_DURATION_MS);
      
      // التطهير الذاتي: إذا انتقل الوقت لـ Slot جديد، نلغي التخطي المحلي ليعود البث متزامن تماماً للكل
      if (currentSlot !== lastSlot) {
        localIndexOffset = 0;
        lastSlot = currentSlot;
      }

      const songIndex = (currentSlot + localIndexOffset) % songs.length;
      targetUrl = songs[songIndex].video_url;
      
      // إذا تخطينا محلياً فيديو معطوب، نشغل البديل من البداية 0 لمنع انهيار يوتيوب بسبب فروق الوقت
      if (localIndexOffset > 0) {
        startSeconds = 0;
      } else {
        const slotStartTime = currentSlot * SONG_DURATION_MS;
        startSeconds = Math.floor((now - slotStartTime) / 1000);
      }
    } else {
      targetUrl = 'dQw4w9WgXcQ'; 
    }
  }

  const nId = extractYoutubeId(targetUrl);
  if(player && player.loadVideoById && currentVideoId !== nId && nId) {
    currentVideoId = nId;
    player.loadVideoById({ videoId: nId, startSeconds: Math.max(0, startSeconds) });
    startWatchdog(); // تشغيل الرقيب فوراً لحماية الشاشة من التجميد
  }
}

async function fetchLiveChat() {
  const { data } = await sb.from('channel_chat').select('*').order('id', { ascending: false }).limit(30);
  if(data) {
    const box = document.getElementById('chatBox'); box.innerHTML = '';
    data.reverse().forEach(m => {
      box.innerHTML += `<div class="yt-message"><span class="yt-author">${m.username}:</span> <span class="yt-text">${m.message}</span></div>`;
    });
    box.scrollTop = box.scrollHeight;
  }
}

async function sendChat() {
  const u = document.getElementById('chatUser').value.trim();
  const m = document.getElementById('chatMsg');
  if(!u || !m.value.trim()) return;
  await sb.from('channel_chat').insert([{ username: u, message: m.value.trim() }]);
  m.value = ''; fetchLiveChat();
}

setInterval(() => { controlCenterLoop(); fetchLiveChat(); }, 2500);
fetchLiveChat();
</script>
</body>
</html>

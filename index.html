<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم الإذاعية — إدارة البث والمكسر</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Tajawal', sans-serif; background: #06060c; color: #e1e1e6; padding: 20px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.studio-panel { background: #0d0d18; border: 1px solid #ff4757; width: 100%; max-width: 600px; border-radius: 12px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
.panel-title { text-align: center; color: #ff4757; font-weight: 900; font-size: 1.3rem; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; }

/* ستايل أقسام ميكسر الصوت */
.section-box { background: #131324; border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 15px; margin-bottom: 18px; }
.section-title { font-size: 0.9rem; color: #ff4757; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid rgba(255,255,255,0.04); padding-bottom: 6px; }

.mixer-container { display: flex; align-items: center; gap: 15px; background: #1a1a30; padding: 12px; border-radius: 8px; }
.volume-slider { flex: 1; accent-color: #ff4757; cursor: pointer; height: 8px; }

.studio-input { width: 100%; padding: 12px; background: #1a1a30; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; color: #fff; font-family: inherit; font-size: 0.9rem; }
.studio-input:focus { outline: none; border-color: #ff4757; }

.btn { padding: 11px 18px; border: none; border-radius: 6px; font-weight: 700; font-size: 0.88rem; cursor: pointer; color: #fff; transition: background 0.2s; }
.btn-danger { background: #ff4757; } .btn-danger:hover { background: #ff2a3b; }
.btn-success { background: #2ed573; } .btn-success:hover { background: #22c15f; }
.btn-secondary { background: #1e90ff; width: 100%; margin-top: 5px; }

.songs-list { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.song-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 6px 10px; border-radius: 4px; font-size: 0.82rem; }
.toast { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); background: #2ed573; color: #fff; padding: 10px 25px; border-radius: 6px; font-weight: 700; display: none; }
</style>
</head>
<body>

<div class="studio-panel">
  <div class="panel-title"><i class="fa-solid fa-sliders"></i> غرفة تحكم ومكسر غيّر جوك TV</div>
  
  <!-- القسم 1: مكسر الصوت العام عن بعد -->
  <div class="section-box">
    <div class="section-title"><i class="fa-solid fa-volume-high"></i> مكسر الصوت المباشر (التحكم عن بعد عند كل المشاهدين)</div>
    <div class="mixer-container">
      <i class="fa-solid fa-volume-xmark" style="color:#8a8a9e"></i>
      <input type="range" id="volSlider" class="volume-slider" min="0" max="100" value="100" onchange="updateRemoteVolume(this.value)">
      <span id="volNum" style="font-weight:700; font-family:monospace; width:30px;">100%</span>
    </div>
  </div>

  <!-- القسم 2: تشغيل شيء خاص (كبل يشتغل فوراً) -->
  <div class="section-box" style="border-color: rgba(255, 71, 87, 0.4);">
    <div class="section-title" style="color:#ffbc4b;"><i class="fa-solid fa-bolt"></i> ميزة التشغيل الخاص المباشر (كبل واونلاين فوري)</div>
    <div style="display:flex; gap:8px;">
      <input id="instantUrl" type="text" class="studio-input" placeholder="ضع رابط أغنية اليوتيوب الخاصة هنا المُراد تشغيلها فوراً...">
      <button class="btn btn-danger" style="white-space:nowrap;" onclick="playInstant()">بث فوري كِبل 🔴</button>
    </div>
    <button class="btn btn-secondary" style="font-size:0.75rem; padding:5px;" onclick="cancelInstant()">إيقاف التشغيل الخاص والعودة للقائمة التلقائية 🤖</button>
  </div>

  <!-- القسم 3: بناء وتغذية القائمة العراقية التلقائية -->
  <div class="section-box">
    <div class="section-title"><i class="fa-solid fa-list-ul"></i> إدارة قائمتك العراقية التلقائية (الأوتو بايلوت الدائري)</div>
    <div style="display:flex; gap:8px; margin-bottom:10px;">
      <input id="playlistUrl" type="text" class="studio-input" placeholder="ضع رابط الأغنية العراقية لإضافتها للقائمة الدائرية...">
      <button class="btn btn-success" style="white-space:nowrap;" onclick="addToRotation()">إضافة للقائمة ➕</button>
    </div>
    
    <span style="font-size:0.75rem; color:#8a8a9e; font-weight:700;">الأغاني الحالية في الدوران التلقائي:</span>
    <div class="songs-list" id="rotationContainer">جاري تحميل قائمتك...</div>
  </div>

  <!-- القسم 4: شريط الأخبار -->
  <div class="section-box">
    <div class="section-title"><i class="fa-solid fa-bullhorn"></i> شريط الأخبار السفلي</div>
    <div style="display:flex; gap:8px;">
      <input id="tickerInput" type="text" class="studio-input" placeholder="اكتب نص شريط الأخبار...">
      <button class="btn btn-danger" onclick="saveTicker()">تحديث 📢</button>
    </div>
  </div>

</div>

<div class="toast" id="toast">تمت المزامنة بنجاح! 📡</div>

<script>
const SB_URL = 'https://hvgtysuwzdtsgqjgsuhi.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2Z3R5c3V3emR0c2dxamdzdWhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjgyNDIsImV4cCI6MjA5NjE0NDI0Mn0.YjlcTIO_uycIolB3N2dkw0U76iJ76G57uhwpuTavrSM';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

async function loadStudio() {
  const { data: config } = await sb.from('channel_settings').select('*').eq('id', 'live_stream').single();
  if(config) {
    document.getElementById('tickerInput').value = config.ticker_text || '';
    const vol = config.volume !== undefined ? config.volume : 100;
    document.getElementById('volSlider').value = vol;
    document.getElementById('volNum').textContent = vol + '%';
  }
  fetchRotationList();
}

// دالة تحديث مكسر الصوت عن بعد
async function updateRemoteVolume(val) {
  document.getElementById('volNum').textContent = val + '%';
  await sb.from('channel_settings').upsert({ id: 'live_stream', volume: parseInt(val) });
  triggerToast();
}

// دالة تشغيل كبل فوري
async function playInstant() {
  const input = document.getElementById('instantUrl');
  const url = input.value.trim();
  if(!url) return alert('ضع رابط أولاً!');
  
  await sb.from('channel_settings').upsert({
    id: 'live_stream',
    override_url: url,
    override_start: Date.now()
  });
  input.value = '';
  triggerToast();
}

async function cancelInstant() {
  await sb.from('channel_settings').upsert({ id: 'live_stream', override_url: null, override_start: null });
  triggerToast();
}

// إضافة أغانيك العراقية إلى مصفوفة التدوير التلقائي
async function addToRotation() {
  const input = document.getElementById('playlistUrl');
  const url = input.value.trim();
  if(!url) return alert('يرجى وضع رابط!');

  await sb.from('playlist').insert([{ title: 'أغنية عراقية مضافة', video_url: url }]);
  input.value = '';
  triggerToast();
  fetchRotationList();
}

async function fetchRotationList() {
  const { data: songs } = await sb.from('playlist').select('*').order('id', { ascending: true });
  const container = document.getElementById('rotationContainer');
  
  if(!songs || songs.length === 0) {
    container.innerHTML = '<div style="color:#8a8a9e; font-size:0.8rem; text-align:center;">القائمة فارغة تماماً. ضع روابط أغانيك العراقية المفضلة بالأعلى لتشغيل التلقائي!</div>';
    return;
  }

  container.innerHTML = '';
  songs.forEach((song, i) => {
    container.innerHTML += `
      <div class="song-row">
        <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:80%;">السلوت ${i+1}: ${song.video_url}</span>
        <button onclick="deleteSong(${song.id})" style="background:none; border:none; color:#ff4757; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
      </div>`;
  });
}

async function deleteSong(id) {
  await sb.from('playlist').delete().eq('id', id);
  triggerToast();
  fetchRotationList();
}

async function saveTicker() {
  const text = document.getElementById('tickerInput').value.trim();
  await sb.from('channel_settings').upsert({ id: 'live_stream', ticker_text: text });
  triggerToast();
}

function triggerToast() {
  const toast = document.getElementById('toast'); toast.style.display = 'block';
  setTimeout(()=> toast.style.display = 'none', 1500);
}

loadStudio();
</script>
</body>
</html>

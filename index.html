<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>غرفة الإدارة الرئيسية — غير جوك TV</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Tajawal', sans-serif; background: #06060a; color: #e1e1e6;
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
}
.admin-station {
  background: #0f0f18; border: 1px solid rgba(255, 71, 87, 0.3); width: 100%; max-width: 520px;
  border-radius: 16px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(255, 71, 87, 0.05);
}
.station-title {
  text-align: center; color: #ff4757; font-weight: 900; font-size: 1.4rem; margin-bottom: 25px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.input-block { margin-bottom: 20px; }
label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: #8a8a9e; font-weight: 700; }
.admin-input {
  width: 100%; padding: 14px; background: #161622; border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px; color: #fff; font-family: inherit; font-size: 0.95rem; transition: all 0.2s;
}
.admin-input:focus { outline: none; border-color: #ff4757; box-shadow: 0 0 10px rgba(255, 71, 87, 0.2); }
.push-btn {
  width: 100%; padding: 14px; background: #ff4757; color: #fff; border: none; border-radius: 10px;
  font-weight: 700; font-size: 1rem; cursor: pointer; transition: background 0.2s; margin-top: 10px;
}
.push-btn:hover { background: #ff2a3b; }
.status-toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #2ecc71;
  color: #fff; padding: 12px 30px; border-radius: 8px; font-weight: 700; font-size: 0.9rem;
  display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.4); z-index: 99;
}
</style>
</head>
<body>

<div class="admin-station">
  <div class="station-title"><i class="fa-solid fa-satellite-dish"></i> لوحة البث المباشر والأخبار</div>
  
  <div class="input-block">
    <label>نص شريط عاجل / الأخبار (يظهر أسفل الفيديو)</label>
    <textarea id="tickerInput" class="admin-input" rows="3" placeholder="أهلاً بكم في قناة غير جوك للأغاني..."></textarea>
  </div>

  <div class="input-block">
    <label>رابط فيديو أو أغنية اليوتيوب الحالية</label>
    <input type="text" id="videoInput" class="admin-input" placeholder="https://www.youtube.com/watch?v=...">
  </div>

  <button class="push-btn" id="btnSave" onclick="pushToBroadcast()">تحديث البث على الهواء فوراً 🚀</button>
</div>

<div class="status-toast" id="toast">تم بث التحديث إلى القناة بنجاح! 📡</div>

<script>
const SB_URL = 'https://hvgtysuwzdtsgqjgsuhi.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2Z3R5c3V3emR0c2dxamdzdWhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjgyNDIsImV4cCI6MjA5NjE0NDI0Mn0.YjlcTIO_uycIolB3N2dkw0U76iJ76G57uhwpuTavrSM';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

async function loadData() {
  const { data } = await sb.from('channel_settings').select('*').eq('id', 'live_stream').single();
  if(data) {
    document.getElementById('tickerInput').value = data.ticker_text;
    document.getElementById('videoInput').value = data.video_url;
  }
}

async function pushToBroadcast() {
  const t = document.getElementById('tickerInput').value.trim();
  const v = document.getElementById('videoInput').value.trim();
  const b = document.getElementById('btnSave');

  if(!t || !v) { alert('يرجى ملء جميع الحقول!'); return; }
  b.disabled = true; b.textContent = 'جاري إرسال الإشارة...';

  const { error } = await sb.from('channel_settings').upsert({ id: 'live_stream', ticker_text: t, video_url: v });
  b.disabled = false; b.textContent = 'تحديث البث على الهواء فوراً 🚀';

  if(!error) {
    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(()=> toast.style.display = 'none', 3000);
  } else {
    alert('حدث خطأ أثناء التحديث: ' + error.message);
  }
}

loadData();
</script>
</body>
</html>
